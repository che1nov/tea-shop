name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  go-tests:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - shared
          - users-service
          - goods-service
          - order-service
          - payment-service
          - delivery-service
          - notify-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  integration-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Run integration tests
        env:
          INTEGRATION_CLEANUP: "1"
        run: bash tests/integration/run.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [go-tests, frontend]
    strategy:
      fail-fast: false
      matrix:
        service:
          - users-service
          - goods-service
          - order-service
          - payment-service
          - delivery-service
          - notify-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          tags: tea-shop/${{ matrix.service }}:ci

  frontend-docker-build:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: tea-shop/frontend:ci

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        env:
          JWT_SECRET: ci-secret
          ADMIN_PASSWORD: ci-admin-password
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config
