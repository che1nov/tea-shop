apiVersion: v1
kind: Service
metadata:
  name: notify-service
spec:
  selector:
    app: notify-service
  ports:
    - name: metrics
      port: 9006
      targetPort: 9006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notify-service
  template:
    metadata:
      labels:
        app: notify-service
    spec:
      containers:
        - name: notify-service
          image: tea-shop/notify-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9006
          env:
            - name: KAFKA_BROKERS
              value: kafka:29092
            - name: KAFKA_GROUP
              value: notify-service
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: email_from
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: email_password
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9007
      targetPort: 9007
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: tea-shop/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 9007
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: jwt_secret
            - name: USERS_SERVICE
              value: users-service:8001
            - name: GOODS_SERVICE
              value: goods-service:8002
            - name: ORDERS_SERVICE
              value: order-service:8003
            - name: PAYMENTS_SERVICE
              value: payment-service:8004
            - name: DELIVERY_SERVICE
              value: delivery-service:8005
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:5173
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tea-shop/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
