apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  selector:
    app: users-service
  ports:
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: tea-shop/users-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
            - containerPort: 9001
          env:
            - name: DB_HOST
              value: postgres-users
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: users_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: db_password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: jwt_secret
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: admin_email
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tea-shop-secret
                  key: admin_password
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
